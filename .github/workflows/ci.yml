name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master] # Feature branches walin master ekata PR daddi meka trigger wenawa

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SPRING_PROFILES_ACTIVE: test # GitHub Actions Runner eka athule test profile eka active karanawa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
