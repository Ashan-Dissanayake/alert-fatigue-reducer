name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SPRING_PROFILES_ACTIVE: test
      DOCKER_API_VERSION: "1.44"
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Docker daemon & permissions
        run: |
          sudo chmod 666 /var/run/docker.sock
          mkdir -p ~/.testcontainers
          echo "docker.client.strategy=org.testcontainers.dockerclient.UnixSocketClientProviderStrategy" > ~/.testcontainers.properties
          echo "testcontainers.reuse.enable=false" >> ~/.testcontainers.properties
          docker info
          docker version

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest="!*IntegrationTest,!AlertFatigueReducerApplicationTests"

      - name: Run Integration Tests (Container-backed)
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest="*IntegrationTest,AlertFatigueReducerApplicationTests"
        continue-on-error: true
