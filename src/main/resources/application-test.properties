# Database - Test Environment (Overridden for GitHub Actions Runner)
spring.datasource.url=jdbc:h2:mem:alert_fatigue_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.security.username=test-admin
app.security.password=test-only-password
