spring.application.name=alert-fatigue-reducer
server.port=${SERVER_PORT:8080}

# Database - Local Developer Machine
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alert_fatigue}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=never

# Application Information
info.app.name=Alert Fatigue Reducer
info.app.version=0.1.0

# Security (Local defaults if env variables are empty)
app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:password123}
